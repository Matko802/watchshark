<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirm email — WatchShark</title>
<link rel="icon" type="image/png" href="/favicon.png?v=1">
<link rel="stylesheet" href="/styles.css?v=36">
<link rel="preload" href="/vendor/fonts/f1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/vendor/fonts/f0.woff2" as="font" type="font/woff2" crossorigin>
<link href="/vendor/fonts.css" rel="stylesheet">

<script type="module">import '/vendor/material-web.js';</script>
<meta property="og:site_name" content="WatchShark">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:title" content="WatchShark">
<meta property="og:description" content="WatchShark — watch and share videos, wheels and music.">
<meta property="og:image" content="https://watchshark.duckdns.org/watchshark.webp">
</head>
<body data-pjax="1">
<header class="topbar">
  <a class="brand" href="/"><img src="/watchshark.webp?v=2" alt="WatchShark logo"><span>WatchShark</span></a>
</header>
<main>
  <div id="box"><md-linear-progress indeterminate></md-linear-progress></div>
</main>
<script>
(async () => {
  const token = new URLSearchParams(location.search).get('token') || '';
  const box = document.getElementById('box');
  if (!token) { box.innerHTML = '<p class="muted">Missing confirmation link.</p>'; return; }
  try {
    const r = await fetch('/api/auth/verify?token=' + encodeURIComponent(token));
    if (r.ok) {
      box.innerHTML = '<h2>Email confirmed!</h2><p class="muted">Your account is ready. Sign in to start watching and uploading.</p><md-filled-button href="/">Go to WatchShark<md-icon slot="icon">arrow_forward</md-icon></md-filled-button>';
    } else {
      const j = await r.json();
      box.innerHTML = '<h2>Link did not work</h2><p class="muted">' + j.error + '</p><md-outlined-button href="/forgot">Get a new link</md-outlined-button>';
    }
  } catch {
    box.innerHTML = '<p class="muted">Network error. Try again later.</p>';
  }
})();
</script>
</body>
</html>
