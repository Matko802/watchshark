.dmwrap { display: flex; gap: 16px; align-items: stretch; height: calc(100dvh - 220px); min-height: 420px; }
#dmFriends { flex: 0 0 280px; max-width: 38vw; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--md-sys-color-outline-variant); padding-right: 12px; }
#dmThread { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
#dmChat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.dmrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; cursor: pointer; text-decoration: none; color: inherit; }
.dmrow:hover { background: rgba(255,255,255,.06); }
.dmrow.active { background: rgba(255,255,255,.1); }
#dmMsgs { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 12px 4px; overflow-y: auto; min-height: 0; }
.msgrow { display: flex; flex-direction: column; max-width: 78%; }
.msgrow.mine { align-self: flex-end; align-items: flex-end; }
.msgrow.theirs { align-self: flex-start; align-items: flex-start; }
.bubble { padding: 10px 14px; border-radius: 18px; background: #1e1e1e; color: #fff; font-size: 15px; overflow-wrap: anywhere; white-space: pre-wrap; }
.msgrow.mine .bubble { background: #f5f5f5; color: #000; border-bottom-right-radius: 6px; }
.msgrow.theirs .bubble { border-bottom-left-radius: 6px; }
.msgtime { font-size: 11px; color: var(--md-sys-color-on-surface-variant); margin: 2px 6px 6px; }
.dmform { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
#dmEmpty { margin: auto; text-align: center; }
@media (max-width: 720px) {
  .dmwrap { flex-direction: column; height: calc(100dvh - 240px); }
  .dmwrap.chatting #dmFriends { display: none; }
  .dmwrap:not(.chatting) #dmThread { display: none; }
  #dmFriends { flex: none; max-width: none; width: 100%; border-right: none; }

<script>
(function() {
  const acc = document.getElementById('navAccount');
  const navAv = document.getElementById('navAvatar');
  fetch('/api/me', { credentials: 'include' }).then((r) => r.json()).then((j) => {
    if (j && j.user) {
      acc.href = '/channel?user=' + encodeURIComponent(j.user.username);
      acc.dataset.user = j.user.username;
      if (navAv) navAv.innerHTML = avatarHtml(j.user.avatar, 'navavatar');
    }
  }).catch(() => {});
  acc.addEventListener('click', (e) => {
    if (!acc.dataset.user) {
      e.preventDefault();
      if (typeof openAuth === 'function') openAuth('login');
      else location.href = '/';
    }
  });
})();
</script>


<script src="/app.js?v=14"></script>
<script>
let DM = { peer: null, peerKey: null, maxId: 0, timer: 0, me: null, myId: 0 };
window.__destroy = function() { if (DM.timer) clearInterval(DM.timer); };
function dmNote(t) {
  document.getElementById('dm-msg').textContent = t || '';
}
function fmtTime(s) {
  const ms = Date.parse(String(s).replace(' ', 'T'));
  if (isNaN(ms)) return '';
  return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
async function initMessages() {
  const u = await refreshAuth();
  if (!u) { location.href = '/'; return; }
  DM.me = u.username;
  DM.myId = u.id || 0;
  if (typeof crypto === 'undefined' || !crypto.subtle) {
    dmNote('Encrypted chat needs a secure (https) page. Open this site over https.');
    return;
  }
  if (!await dmEnsureUploaded()) {
    dmNote('Could not set up encryption. Reload and try again.');
    return;
  }
  const q = new URLSearchParams(location.search).get('user');
  await loadFriends(q);
  if (DM.timer) clearInterval(DM.timer);
  DM.timer = setInterval(() => { if (DM.peer) loadThread(false); }, 3000);
}
async function loadFriends(select) {
  const r = await fetch('/api/friends', { credentials: 'include' });
  if (!r.ok) { location.href = '/'; return; }
  const j = await r.json();
  const box = document.getElementById('dmFriends');
  const list = j.friends || [];
  if (!list.length) {
    box.innerHTML = '<p class="muted">No friends yet. Follow someone and have them follow you back.</p>';
    return;
  }
  box.innerHTML = list.map((f) =>
    `<a class="dmrow${f.username === DM.peer ? ' active' : ''}" href="/messages?user=${esc(f.username)}" data-user="${esc(f.username)}">` +
    `${avatarHtml(f.avatar, 'pfp-sm')}<span>@${esc(f.username)}</span></a>`).join('');
  box.querySelectorAll('[data-user]').forEach((a) => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      openThread(a.dataset.user);
    });
  });
  const target = select || (list.length === 1 ? list[0].username : null);
  if (target) openThread(target);
}
async function openThread(username) {
  DM.peer = username;
  DM.peerKey = null;
  DM.maxId = 0;
  document.getElementById('dmMsgs').innerHTML = '';
  document.getElementById('dmWrap').classList.add('chatting');
  document.getElementById('dmEmpty').style.display = 'none';
  document.getElementById('dmChat').style.display = '';
  document.getElementById('dmTitle').textContent = '@' + username;
  document.querySelectorAll('#dmFriends .dmrow').forEach((a) => {
    a.classList.toggle('active', a.dataset.user === username);
  });
  try {
    history.replaceState({}, '', '/messages?user=' + encodeURIComponent(username));
  } catch {}
  await loadThread(true);
}
async function peerKey() {
  if (DM.peerKey) return DM.peerKey;
  const r = await fetch('/api/dm/key/' + encodeURIComponent(DM.peer), { credentials: 'include' });
  if (!r.ok) return null;
  const j = await r.json();
  DM.peerKey = j.pubkey || null;
  return DM.peerKey;
}
async function loadThread(initial) {
  if (!DM.peer) return;
  const key = await peerKey();
  if (!key) {
    if (initial) dmNote('@' + DM.peer + ' has not opened messages yet — they need to open it once first.');
    return;
  }
  dmNote('');
  const r = await fetch('/api/dm/thread?user=' + encodeURIComponent(DM.peer) +
    '&after_id=' + DM.maxId + '&limit=50', { credentials: 'include' });
  if (!r.ok) {
    if (initial) dmNote('Could not load chat. Check connection and retry.');
    return;
  }
  const j = await r.json();
  const box = document.getElementById('dmMsgs');
  for (const m of (j.messages || [])) {
    if (m.id <= DM.maxId) continue;
    DM.maxId = m.id;
    let text = null;
    try { text = await dmDecrypt(key, m.nonce, m.body); } catch {}
    if (text == null) continue;
    appendBubble(text, m.sender_id === DM.myId, m.created_at);
  }
  box.scrollTop = box.scrollHeight;
}
function appendBubble(text, mine, at) {
  const row = document.createElement('div');
  row.className = 'msgrow' + (mine ? ' mine' : ' theirs');
  const d = document.createElement('div');
  d.className = 'bubble';
  d.textContent = text;
  row.appendChild(d);
  const t = fmtTime(at || '');
  if (t) {
    const s = document.createElement('div');
    s.className = 'msgtime';
    s.textContent = t;
    row.appendChild(s);
  }
  const box = document.getElementById('dmMsgs');
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}
async function sendDm() {
  const inp = document.getElementById('dmInput');
  const text = (inp.value || '').trim();
  if (!text || !DM.peer) return;
  const key = await peerKey();
  if (!key) {
    dmNote('@' + DM.peer + ' has not opened messages yet — they need to open it once first.');
    return;
  }
  let enc = null;
  try { enc = await dmEncrypt(key, text); } catch {}
  if (!enc) {
    dmNote('Encrypt failed on this browser.');
    return;
  }
  const r = await fetch('/api/dm/send', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ to: DM.peer, nonce: enc.nonce, body: enc.body }),
  });
  if (!r.ok) {
    dmNote(r.status === 403 ? 'You are no longer friends.' : 'Send failed. Retry.');
    return;
  }
  const j = await r.json();
  if (j.id > DM.maxId) DM.maxId = j.id;
  inp.value = '';
  appendBubble(text, true, new Date().toISOString());
}
document.getElementById('dmSend').addEventListener('click', sendDm);
document.getElementById('dmInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) sendDm();
});
initMessages();
hideBoot();
</script>
