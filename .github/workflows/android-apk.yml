name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build APKs
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon -x test 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "Gradle exit: $code"
          exit $code

      - name: Surface Kotlin errors as annotations
        if: failure()
        run: |
          grep -oP '^e: file://\K[^ ]+' build.log | head -n 20 > kerrors.txt || true
          cat build.log | grep -E '^e: ' | head -n 30 || true
          # Emit file annotations (public via Checks API) so errors are visible without log access.
          grep -P '^e: file://' build.log | head -n 20 | while IFS= read -r line; do
            f=$(echo "$line" | sed -E 's#^e: file://##; s#:[0-9:]+ .*##')
            # Make path repo-relative for the annotation.
            rel=$(echo "$f" | sed -E 's#^/home/runner/work/watchshark/watchshark/##')
            msg=$(echo "$line" | cut -c1-500)
            echo "::error file=$rel::$msg"
          done || true

      - name: Show outputs
        run: ls -la app/build/outputs/apk/release/ app/build/outputs/apk/debug/

      - name: Verify signature
        run: |
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | head -n 8

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchShark-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: watchshark-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # Fully automatic releases: whenever versionName in build.gradle.kts has
  # no android-v<version> tag yet, tag it and publish a GitHub Release with
  # the signed APK (the exact asset the in-app updater looks for).
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=android-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing tag
        id: tagcheck
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release APK
        if: steps.tagcheck.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: WatchShark-apk
          path: apk
      - name: Prepare asset
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          ls -la apk
          cp apk/app-release.apk "WatchShark-${{ steps.ver.outputs.version }}.apk"

      - name: Publish GitHub Release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Android v${{ steps.ver.outputs.version }}
          files: WatchShark-${{ steps.ver.outputs.version }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            M3 Expressive Compose UI (dynamic color, NavigationBar + NavigationRail, SearchBar, YouTube-proper tabs).
            Built from main. In-app updater looks for WatchShark-<version>.apk.
