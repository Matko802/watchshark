name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore release keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > release.keystore
            echo "RELEASE_STORE_FILE=$PWD/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets"
          else
            echo "No release keystore secret, falling back to debug.keystore (old 1.8.x key)"
          fi

      - name: Build APKs
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon -x test -x lint 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "Gradle exit: $code"
          exit $code

      - name: Surface build errors as annotations
        if: failure()
        run: |
          ls -la
          echo "--- build.log size ---"
          wc -l build.log 2>/dev/null || echo "NO build.log"
          echo "--- e: lines ---"
          grep -E '^e: ' build.log | head -n 30 || echo "(no ^e: lines)"
          # Emit Kotlin errors with repo-relative file paths.
          grep -P '^e: file://' build.log | head -n 20 | while IFS= read -r line; do
            f=$(echo "$line" | sed -E 's#^e: file://##; s#:[0-9:]+ .*##')
            rel=$(echo "$f" | sed -E 's#^/home/runner/work/watchshark/watchshark/##')
            msg=$(echo "$line" | cut -c1-800)
            echo "::error file=$rel::$msg"
          done || true
          echo "--- last 40 log lines as warnings ---"
          tail -n 40 build.log | cut -c1-800 | while IFS= read -r line; do
            # Escape % for workflow commands.
            safe=$(echo "$line" | sed 's/%/%25/g')
            echo "::warning::$safe"
          done || true

      - name: Show outputs
        run: ls -la app/build/outputs/apk/release/ app/build/outputs/apk/debug/

      - name: Verify signature
        run: |
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | head -n 8

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchShark-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: watchshark-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # Fully automatic releases: whenever versionName in build.gradle.kts has
  # no android-v<version> tag yet, tag it and publish a GitHub Release with
  # the signed APK (the exact asset the in-app updater looks for).
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=android-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing tag
        id: tagcheck
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release APK
        if: steps.tagcheck.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: WatchShark-apk
          path: apk
      - name: Prepare asset
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          ls -la apk
          cp apk/app-release.apk "WatchShark-${{ steps.ver.outputs.version }}.apk"

      - name: Publish GitHub Release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Android v${{ steps.ver.outputs.version }}
          files: WatchShark-${{ steps.ver.outputs.version }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            WatchShark 1.9.2: Grey theme removed, slide-down-to-minimize gesture and mini player removed.
            Built from main. In-app updater looks for WatchShark-<version>.apk.
